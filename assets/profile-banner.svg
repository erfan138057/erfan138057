  <g filter="url(#glow)" opacity=".9"><circle cx="1010" cy="150" r="5" fill="#2dd4bf"/><circle cx="1060" cy="115" r="3" fill="#60a5fa"/><circle cx="1110" cy="175" r="4" fill="#2dd4bf"/></g>
