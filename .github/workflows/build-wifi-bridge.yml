name: Build Wi-Fi Bridge A36 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'WifiBridgeA36/**'
      - '.github/workflows/build-wifi-bridge.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: WifiBridgeA36
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WifiBridgeA36-debug-apk
          path: WifiBridgeA36/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
